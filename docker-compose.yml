services:
  gemini-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gemini-cli-server
    networks:
      - shared-network
    ports:
      - "8787:8787" # Host:Container port mapping
    #     volumes:
    #       # Mount project directory for hot reloading during development
    #       - .:/app
    #       # Exclude node_modules to avoid conflicts between host and container
    #       - /app/node_modules
    environment:
      - NODE_ENV=production
      - PORT=8787
    # Load environment variables from .env file
    env_file:
      - .env
    # Restart policy
    restart: unless-stopped
    # Health check
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8787/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  shared-network:
    external: true
